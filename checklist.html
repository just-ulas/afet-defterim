<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>checklist · afet defterim</title>
<link rel="stylesheet" href="stil/ana.css">
<style>
.chk-list{list-style:none;margin:1rem 0;padding:0}
.chk-list li{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid #eee}
.chk-list input{width:1.15rem;height:1.15rem;margin-top:.15rem}
.ozet{background:#fef2f2;padding:.75rem 1rem;border-radius:8px;margin:1rem 0}
select{padding:.4rem;font-size:1rem;margin:1rem 0}
</style>
</head>
<body>
<header>
  <h1>checklist</h1>
  <p>işaretler telefonda kalır</p>
</header>
<p class="banner"><a href="index.html">notlar</a> · <a href="sos.html">sos</a></p>
<main>
  <label>liste
    <select id="sec">
      <option value="deprem">deprem</option>
      <option value="yangin">yangın</option>
      <option value="canta">çanta</option>
      <option value="sel">sel</option>
    </select>
  </label>
  <div class="ozet" id="ozet">—</div>
  <div id="liste"></div>
</main>
<script type="module">
import { renderListe, ozet } from './kod/checklist-motor.js';
const sec = document.getElementById('sec');
const liste = document.getElementById('liste');
const ozetEl = document.getElementById('ozet');

async function yukle() {
  const id = sec.value;
  const r = await fetch('veri/checklist/' + id + '.json');
  const data = await r.json();
  renderListe(data.maddeler, liste);
  const o = ozet(data.maddeler.map(m => m.id));
  ozetEl.textContent = data.baslik + ': ' + o.tamam + '/' + o.toplam + ' (%' + o.yuzde + ')';
  liste.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      const o2 = ozet(data.maddeler.map(m => m.id));
      ozetEl.textContent = data.baslik + ': ' + o2.tamam + '/' + o2.toplam + ' (%' + o2.yuzde + ')';
    });
  });
}
sec.onchange = yukle;
yukle();
</script>
</body>
</html>
