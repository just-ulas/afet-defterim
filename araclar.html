<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>araçlar · afet</title>
<link rel="stylesheet" href="stil/ana.css">
<link rel="stylesheet" href="stil/ataturk.css">
<link rel="manifest" href="manifest.json">
<style>
.arac{display:block;width:100%;max-width:420px;margin:.5rem auto;padding:1rem;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;text-align:left}
.arac small{display:block;font-weight:400;opacity:.8;margin-top:.25rem}
#cikti{max-width:420px;margin:1rem auto;padding:1rem;font-family:monospace;font-size:.85rem;min-height:3rem;background:#f5f5f4;border-radius:8px;white-space:pre-wrap}
.kirmizi{background:#dc2626;color:#fff}
.sari{background:#ca8a04;color:#1c1000}
.mavi{background:#1d4ed8;color:#fff}
.gri{background:#44403c;color:#fff}
.yesil{background:#15803d;color:#fff}
</style>
</head>
<body>
<header>
  <h1>araçlar</h1>
  <p>mors · sinyal · nefes · artçı · pusula</p>
</header>
<p class="banner"><a href="enkaz.html">enkaz</a> · <a href="profil.html">profil</a> · <a href="index.html">notlar</a></p>

<button type="button" class="arac kirmizi" id="btnMors">📡 mors SOS<small>ses + titreşim · 3 tur</small></button>
<button type="button" class="arac sari" id="btnPer">⏱ periyodik sinyal<small>15 sn’de bir kısa düdük</small></button>
<button type="button" class="arac mavi" id="btnNefes">🌬️ sakinleş<small>4-4-4 nefes</small></button>
<button type="button" class="arac gri" id="btnArtci">📋 artçı kaydet<small>hissettiğin sarsıntıyı not et</small></button>
<button type="button" class="arac yesil" id="btnPusula">🧭 pusula<small>yön (destekleyen cihazda)</small></button>
<button type="button" class="arac gri" id="btnWake">👁 ekran açık kalsın<small>wake lock</small></button>
<button type="button" class="arac gri" id="btnDisa">📤 profil dışa aktar<small>metin kopyala</small></button>

<div id="cikti">hazır</div>

<script type="module">
import { morsSOS } from './kod/mors.js';
import { periyodikBaslat, periyodikDurdur, sinyalAcikMi } from './kod/periyodik-sinyal.js';
import { nefesBaslat } from './kod/nefes.js';
import { artciEkle, artciOzet, artciListe } from './kod/artci-gunluk.js';
import { pusulaDinle } from './kod/pusula.js';
import { wakeAc, wakeKapat, wakeVarMi } from './kod/wake.js';
import { oku } from './kod/depo.js';
import { liste } from './kod/kontaklar.js';
import { registerPWA } from './kod/pwa.js';

const out = document.getElementById('cikti');
function yaz(t) { out.textContent = t; }

let morsCtrl = null;
let nefesCtrl = null;
let pusula = null;

document.getElementById('btnMors').onclick = async () => {
  if (morsCtrl) { morsCtrl.dur(); morsCtrl = null; yaz('mors iptal'); return; }
  morsCtrl = await morsSOS({ tur: 3, onDurum: yaz });
};
document.getElementById('btnPer').onclick = () => {
  if (sinyalAcikMi()) { periyodikDurdur(); yaz('periyodik kapalı'); }
  else { periyodikBaslat({ herMs: 15000, calMs: 2500, onTick: yaz }); yaz('periyodik açık'); }
};
document.getElementById('btnNefes').onclick = () => {
  if (nefesCtrl) { nefesCtrl.dur(); nefesCtrl = null; yaz('nefes iptal'); return; }
  nefesCtrl = nefesBaslat((msg) => yaz(msg), 4);
};
document.getElementById('btnArtci').onclick = () => {
  const sev = parseInt(prompt('şiddet 1-3?', '2') || '2', 10);
  artciEkle(sev, 'manuel');
  yaz(artciOzet());
};
document.getElementById('btnPusula').onclick = async () => {
  if (pusula) { pusula.disable(); pusula = null; yaz('pusula kapalı'); return; }
  pusula = pusulaDinle((deg, ad) => yaz('pusula: ' + Math.round(deg) + '° ' + ad));
  yaz((await pusula.enable()) ? 'pusula açık' : 'destek yok');
};
document.getElementById('btnWake').onclick = async () => {
  if (wakeVarMi()) { await wakeKapat(); yaz('wake kapalı'); }
  else yaz((await wakeAc()) ? 'ekran açık kalacak' : 'destek yok');
};
document.getElementById('btnDisa').onclick = async () => {
  const p = oku('profil', {}) || {};
  const k = liste();
  const txt = ['afet-defterim profil', 'ad: ' + (p.ad || '-'), 'kan: ' + (p.kan || '-'), 'not: ' + (p.not || '-'), 'kişiler:', ...k.map(x => '- ' + x.ad + ' ' + x.tel)].join('\n');
  try { await navigator.clipboard.writeText(txt); yaz('kopyalandı\n' + txt); } catch { yaz(txt); }
};
registerPWA();
yaz(artciOzet());
</script>
<script type="module" src="kod/ataturk-cikartma.js"></script>
</body>
</html>
